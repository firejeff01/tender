name: Build and Release MSI

# 觸發時機：push 到 main 分支
on:
  push:
    branches:
      - main

permissions:
  contents: write   # 建立 Release + 上傳 asset 需要

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX 5
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Generate version from current time
        id: ver
        shell: pwsh
        run: |
          # ⚠️ MSI ProductVersion 比較只看前 3 段 (Major.Minor.Build)，Revision 被忽略。
          # 同時 MSI 限制 Major≤255、Minor≤255、Build≤65535。
          # 與 build-msi.ps1 同一套邏輯，每分鐘 build 都產生 MSI-可比較的不同版號：
          #   Major = 1
          #   Minor = (Year-2026)*12 + (Month-1)                  (每月遞增, ~21 年內 < 256)
          #   Build = (Day-1)*1440 + Hour*60 + Minute             (月內每分鐘遞增, 最大 44639)
          #   Rev   = Month*100 + Day                             (純資訊提示)
          $now = Get-Date
          $minor = ($now.Year - 2026) * 12 + ($now.Month - 1)
          $build = ($now.Day - 1) * 1440 + $now.Hour * 60 + $now.Minute
          $rev = $now.Month * 100 + $now.Day
          $version = "1.$minor.$build.$rev"
          $tag = "v$version"
          Write-Host "Version: $version"
          Write-Host "Tag: $tag"
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore Tender.slnx

      - name: Audit packages for known vulnerabilities
        shell: pwsh
        run: |
          # 列出含已知漏洞的 NuGet 套件（含遞移依賴）。
          # 逐個 csproj 跑（不能用 Tender.slnx：slnx 會把 Tender.Installer.wixproj
          # 拉進來，但 wixproj 不支援 dotnet list package，會讓整個 step exit 1）。
          # 目前不阻斷 build，只 print warning；若想嚴格阻斷把 Write-Warning 改 throw。
          $projects = Get-ChildItem -Path . -Recurse -Filter *.csproj -File `
            | Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } `
            | Select-Object -ExpandProperty FullName
          $hasVuln = $false
          foreach ($p in $projects) {
            $rel = Resolve-Path -Relative $p
            Write-Host "=== $rel ==="
            $output = dotnet list $p package --vulnerable --include-transitive 2>&1 | Out-String
            Write-Host $output
            # 用 advisory URL 比對（locale-agnostic；en-US 與 zh-TW 輸出文字不同）
            if ($output -match 'github\.com/advisories/') {
              $hasVuln = $true
            }
          }
          if ($hasVuln) {
            Write-Warning 'Vulnerable packages detected; review the audit output above.'
          } else {
            Write-Host 'No known vulnerable packages found.'
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test tests/Tender.Core.Tests/Tender.Core.Tests.csproj --nologo --verbosity minimal
          dotnet test tests/Tender.Crawler.Tests/Tender.Crawler.Tests.csproj --nologo --verbosity minimal
          dotnet test tests/Tender.Storage.Tests/Tender.Storage.Tests.csproj --nologo --verbosity minimal

      - name: Build MSI
        shell: pwsh
        run: .\build\build-msi.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Verify MSI exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\TenderSearch.msi")) { throw "MSI not produced" }
          $size = (Get-Item "dist\TenderSearch.msi").Length / 1MB
          Write-Host ("MSI size: {0:N1} MB" -f $size)

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          # 產生 dist\TenderSearch.msi.sha256，格式為「<hash>  <filename>」相容
          # PowerShell 的 Get-FileHash 與 sha256sum -c 兩種驗證方式
          $hash = (Get-FileHash -Algorithm SHA256 dist\TenderSearch.msi).Hash.ToLowerInvariant()
          "$hash  TenderSearch.msi" | Out-File -FilePath dist\TenderSearch.msi.sha256 -Encoding ascii -NoNewline
          Write-Host "SHA256: $hash"

      - name: Create GitHub Release with MSI asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/TenderSearch.msi
            dist/TenderSearch.msi.sha256
