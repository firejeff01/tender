name: Build MSI

# 觸發時機：push 到 main 分支
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX 5
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Restore
        run: dotnet restore Tender.slnx

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test tests/Tender.Core.Tests/Tender.Core.Tests.csproj --nologo --verbosity minimal
          dotnet test tests/Tender.Crawler.Tests/Tender.Crawler.Tests.csproj --nologo --verbosity minimal
          dotnet test tests/Tender.Storage.Tests/Tender.Storage.Tests.csproj --nologo --verbosity minimal

      - name: Build MSI
        shell: pwsh
        run: .\build\build-msi.ps1

      - name: Verify MSI exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\TenderSearch.msi")) { throw "MSI not produced" }
          $size = (Get-Item "dist\TenderSearch.msi").Length / 1MB
          Write-Host ("MSI size: {0:N1} MB" -f $size)

      - name: Upload MSI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenderSearch-MSI
          path: dist/TenderSearch.msi
          retention-days: 30
