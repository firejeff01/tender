name: Build and Release MSI

# 觸發時機：push 到 main 分支
on:
  push:
    branches:
      - main

permissions:
  contents: write   # 建立 Release + 上傳 asset 需要

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX 5
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Generate version from current time
        id: ver
        shell: pwsh
        run: |
          # 與 build-msi.ps1 同一套邏輯：1.{year-2025}.{MMDD}.{HHmm}
          $now = Get-Date
          $minor = $now.Year - 2025
          $build = $now.Month * 100 + $now.Day
          $rev = $now.Hour * 100 + $now.Minute
          $version = "1.$minor.$build.$rev"
          $tag = "v$version"
          Write-Host "Version: $version"
          Write-Host "Tag: $tag"
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore Tender.slnx

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test tests/Tender.Core.Tests/Tender.Core.Tests.csproj --nologo --verbosity minimal
          dotnet test tests/Tender.Crawler.Tests/Tender.Crawler.Tests.csproj --nologo --verbosity minimal
          dotnet test tests/Tender.Storage.Tests/Tender.Storage.Tests.csproj --nologo --verbosity minimal

      - name: Build MSI
        shell: pwsh
        run: .\build\build-msi.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Verify MSI exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\TenderSearch.msi")) { throw "MSI not produced" }
          $size = (Get-Item "dist\TenderSearch.msi").Length / 1MB
          Write-Host ("MSI size: {0:N1} MB" -f $size)

      - name: Create GitHub Release with MSI asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: dist/TenderSearch.msi
